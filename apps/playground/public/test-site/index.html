<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TinyBrowser test site</title></head>
  <body>
    <header><nav aria-label="Primary"><a href="#features">Features</a> <a href="#contact">Contact</a> <a id="new-tab-link" href="#features" target="_blank">Open features in a new tab</a></nav></header>
    <main>
      <h1>TinyBrowser interaction laboratory</h1>
      <p>A local, deterministic page for testing semantic snapshots and actions.</p>
      <label for="search">Search terms</label>
      <input id="search" name="search" type="search" placeholder="Try TinyGPT">
      <button id="send" type="button">Send query</button>
      <p id="result" aria-live="polite"></p>
      <label><input type="checkbox" id="updates"> Receive updates</label>
      <label for="plan">Plan</label>
      <select id="plan"><option value="starter">Starter</option><option value="pro">Pro</option></select>
      <section id="features"><h2>Features</h2><button id="reveal" type="button">Reveal status</button><p id="status"></p></section>
      <button id="popup" type="button">Open features window</button>
    </main>
    <script>
      const search = document.querySelector('#search');
      document.querySelector('#send').addEventListener('click', () => document.querySelector('#result').textContent = `Searching for: ${search.value}`);
      document.querySelector('#reveal').addEventListener('click', () => document.querySelector('#status').textContent = 'The mutation observer saw this update.');
      document.querySelector('#popup').addEventListener('click', () => window.open('#features', '_blank'));
    </script>
  </body>
</html>
